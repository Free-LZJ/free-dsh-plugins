# dsh bundle patch: installing this package as a bundle makes `dsh plugin add`
# insert the one Loader row the workbench needs, so it mounts on the next start.
#
# The id doubles as the Host service name (`ctx.console`) every adopting plugin
# depends on, as the settings namespace its notification channels are edited
# through, as the route prefix (`/dsh-console`), and as the main-panel id the
# browser half occupies. It must stay `console`.
- insert:
    - id: console
      name: '@free-lzj/dsh-console'
