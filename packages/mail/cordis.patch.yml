# dsh bundle patch: installing this package as a bundle makes `dsh plugin add`
# insert the one Loader row the plugin needs, so it mounts on the next start.
#
# The id doubles as the route namespace the Host half serves, the panel id the
# browser half registers, and the `ctx.mail` service name. It must stay `mail`:
# renaming it would strand every profile that already carries the row. Triage is
# part of this plugin now, so its rules, run history and routes live under
# `/dsh-mail/triage` rather than in a package of their own.
- insert:
    - id: mail
      name: '@free-lzj/dsh-mail'
