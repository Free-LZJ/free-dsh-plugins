# dsh bundle patch: installing this package as a bundle makes `dsh plugin add`
# insert the one Loader row the browser capability needs, so it mounts on the
# next start.
#
# The id doubles as this package's route prefix (`/dsh-browser-use`) and as the
# locale namespace key the browser half registers. It must stay `browser-use`:
# the harness's own sidebar browser uses `browser`, and two Loader rows sharing
# an id are rejected by the plugin market's preflight.
- insert:
    - id: browser-use
      name: '@free-lzj/dsh-browser-use'
