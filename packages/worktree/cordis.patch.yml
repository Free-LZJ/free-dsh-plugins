# dsh bundle patch: installing this package as a bundle makes `dsh plugin add`
# insert the one Loader row the worktree picker needs, so it mounts on the next
# start.
#
# The id doubles as this package's route prefix (`/dsh-worktrees`) and as the
# locale namespace key the browser half registers. It must stay `worktrees`:
# `worktree` is already taken by the official experimental bundle
# (`@deepseek-ai/dsh-experimental-worktree`), and two Loader rows sharing an id
# are rejected by the plugin market's preflight.
- insert:
    - id: worktrees
      name: '@free-lzj/dsh-worktree'
