# dsh bundle patch: installing this package as a bundle makes `dsh plugin add`
# insert the one Loader row the plugin needs, so it mounts on the next start.
#
# The id doubles as the settings/route namespace the Host half serves, so it
# must stay `directory-guide`.
- insert:
    - id: directory-guide
      name: '@free-lzj/dsh-directory-guide'
