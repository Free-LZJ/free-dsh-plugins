<style>:root{
  color-scheme:light;

  --guide-ok:#226647;--guide-warn:#835b10;--guide-danger:#9d3025;--guide-idle:#526172;
  --guide-scrim:#15263b70;
  --guide-hover:color-mix(in srgb,var(--guide-fg) 7%,var(--guide-surface));
  --guide-selected:color-mix(in srgb,var(--guide-accent) 15%,var(--guide-surface));
  --guide-titlebar:color-mix(in srgb,var(--guide-accent) 12%,var(--guide-surface));
  --guide-accent-strong:color-mix(in srgb,var(--guide-accent) 78%,var(--guide-fg));
  --guide-ok-weak:color-mix(in srgb,var(--guide-ok) 15%,var(--guide-surface));
  --guide-warn-weak:color-mix(in srgb,var(--guide-warn) 15%,var(--guide-surface));
  --guide-info-weak:color-mix(in srgb,var(--guide-info) 15%,var(--guide-surface));
  --guide-danger-weak:color-mix(in srgb,var(--guide-danger) 15%,var(--guide-surface));
  --guide-idle-weak:color-mix(in srgb,var(--guide-idle) 15%,var(--guide-surface));
}
/* 只有在读不到 DSH token 时，才让系统深浅色说话（data-guide-tokens 由桥设置）。 */
@media (prefers-color-scheme:dark){:root:not([data-guide-tokens]){
  color-scheme:dark;
  --guide-page:#16181d;--guide-surface:#1f2228;--guide-surface-2:#24272e;
  --guide-fg:#e6e8ec;--guide-fg-muted:#98a0ad;

}}body{margin:16px;background:var(--guide-page)}#dsh-directory-explorer .ce-grid-wrap{max-height:72vh;overflow:auto}#dsh-directory-explorer thead{position:sticky;top:0;z-index:1}#dsh-directory-explorer .ce-body{min-height:0}</style>

<script>
/* 主题桥：跟随宿主（DSH）当前主题。 */
(() => {
  const MAP = {
    '--guide-page': '--dsw-alias-bg-base',
    '--guide-surface': '--dsw-alias-bg-layer-1',
    '--guide-surface-2': '--dsw-alias-bg-layer-2',
    '--guide-fg': '--dsw-alias-label-primary',
    '--guide-fg-muted': '--dsw-alias-label-secondary',
    '--guide-line': '--dsw-alias-border-l1',
    '--guide-line-strong': '--dsw-alias-border-l2',
    '--guide-accent': '--dsw-alias-brand-primary',
    '--guide-ok': '--dsw-alias-state-success-primary',
    '--guide-warn': '--dsw-alias-state-warn-primary',
    '--guide-danger': '--dsw-alias-state-error-primary',
    '--guide-idle': '--dsw-alias-state-idle-primary',
  };
  const root = document.documentElement;
  const shell = () => { try { const h = window.parent;
    return h && h !== window && h.document && h.document.body ? h : null; } catch { return null; } };
  const prefersDark = () => typeof window.matchMedia === 'function'
    && window.matchMedia('(prefers-color-scheme:dark)').matches;
  const host = shell();
  const read = () => {
    const body = host ? host.document.body : document.body;
    // DSH 把 token 写成 body 的内联变量；computed 兜底覆盖“主题用样式表/类定义”的写法。
    const inline = body.style;
    const computed = (host || window).getComputedStyle(body);
    let found = 0;
    for (const ours of Object.keys(MAP)) {
      const value = (inline.getPropertyValue(MAP[ours]) || computed.getPropertyValue(MAP[ours])).trim();
      if (value) { root.style.setProperty(ours, value); found++; } else root.style.removeProperty(ours);
    }
    // 宿主路径认它自己 body 上的暗色标记；单开路径没有宿主时才问系统偏好。
    const dark = body.hasAttribute('data-ds-dark-theme') || (!host && prefersDark());
    root.style.colorScheme = dark ? 'dark' : 'light';
    root.dataset.guideScheme = dark ? 'dark' : 'light';
    if (found > 0) root.dataset.guideTokens = ''; else delete root.dataset.guideTokens;
  };
  read();
  if (host) {
    let queued = false;
    new MutationObserver(() => { if (queued) return; queued = true;
      requestAnimationFrame(() => { queued = false; read(); }); })
      .observe(host.document.body, { attributes: true, attributeFilter: ['style', 'data-ds-dark-theme'] });
  } else if (typeof window.matchMedia === 'function') {
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', read);
  }
})();
</script>

  <script>/* 只读文件预览：内容仅留在当前页面，不写回文件、不上传。 */
const DshFilePreview = (() => {
  const TEXT_LIMIT = 256 * 1024;
  const IMAGE_LIMIT = 12 * 1024 * 1024;

  function redact(text) {
    // 配置结构各异，遮盖常见凭据字段；凭据专用文件由 readPreview 整体隐藏。
    return text.split('\n').map(line => /(?:secret|token|password|passwd|api[_-]?key|authorization|cookie|credential)\s*["']?\s*[:=]/i.test(line)
      ? line.replace(/([:=]).*$/, '$1 [已遮盖]') : line).join('\n')
      .replace(/\b(?:sk-[A-Za-z0-9_-]{12,}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)\b/g, '[已遮盖]')
      .replace(/(https?:\/\/)[^\s/@]+:[^\s/@]+@/gi, '$1[已遮盖]@')
      .replace(/([?&](?:key|token|secret|password|access_token)=)[^\s&#"']+/gi, '$1[已遮盖]');
  }

  async function listDirectory(handle, path, notes) {
    // 每次只读当前层；避免为了展开一项而扫描整个代码工作区。
    const result = [];
    for await (const child of handle.values()) {
      const directory = child.kind === 'directory';
      // sqlite 子目录中的同类数据库使用明确说明，不把所有子项都当成普通文件。
      const mappedDatabase = path.length===2 && path[0]==='storages' && path[1]==='plugin-store' && /^plugin-store\.sqlite(?:-wal|-shm)?$/.test(child.name);
      const snap = child.snapshot || null;
      const named = path.length === 0 || mappedDatabase ? notes.find(x => x.name === child.name) : null;
      const known = named || snap;
      const parent = notes.find(x => x.name === path[0]);
      let size = null, modified = '—', error = '';
      if (child.snapshot?.mtime) { const d = new Date(child.snapshot.mtime), p = n => String(n).padStart(2, '0');
        modified = d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
      if (!directory) {
        try {
          const file = await child.getFile();
          size = file.size;
          modified = new Date(file.lastModified).toLocaleString('zh-CN', {hour12:false});
        } catch { error = '当前不可读取，请检查文件是否存在或权限是否有效'; }
      }
      const specific = child.name === 'cordis.patch.yml' ? '当前 profile 的补丁层；插件开关与配置改动都在这里，重装时必须保留'
        : child.name === 'cordis.yml' ? 'profile 入口占位文件；实际内容由补丁层组合'
        : child.name === 'SKILL.md' ? '技能说明与执行规则'
        : child.name.endsWith('.jsonl.zst') ? '压缩对话记录；预览显示文件信息，不自动解压'
        : directory ? '子目录；点击进入查看内容' : '文件；点击查看只读预览';
      result.push({name:child.name, directory, size, modified, handle:child, error,
        note:known?.note || specific+(parent?'（重装建议沿用上级）':''), advice:known?.advice || parent?.advice || '需核对'});
    }
    return result.sort((a,b) => Number(b.directory)-Number(a.directory) || a.name.localeCompare(b.name,'zh-CN',{numeric:true}));
  }

  async function readPreview(file, path) {
    const name = file.name.toLowerCase();
    if (file.snapshotSkip) return {kind:'text', summary:'快照 · 未内联正文',
      text:'[快照] '+file.snapshotSkip+'\n\n点『读取实时目录』授权后，可以直接读取磁盘上的真实文件。'};
    if (path.some(part=>part.toLowerCase()==='secrets') || /^(?:auth\.json|\.credentials|\.env(?:\.|$)|cap_sid|sub2api-)/i.test(name)) {
      return {kind:'text', text:'此文件包含或可能包含登录凭据、密钥或授权信息，内容已整体隐藏。', summary:'敏感文件 · 未读取正文'};
    }
    const extension = name.split('.').pop();
    if (['png','jpg','jpeg','gif','webp','bmp','ico'].includes(extension)) {
      if (file.size > IMAGE_LIMIT) return {kind:'text',text:'图片超过 12 MiB，本页不加载。',summary:'大图片 · 未加载'};
      return {kind:'image', file, summary:'图片预览'};
    }
    const bytes = new Uint8Array(await file.slice(0,TEXT_LIMIT).arrayBuffer());
    if (new TextDecoder().decode(bytes.slice(0,16)) === 'SQLite format 3\0') {
      const view = new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
      const pageSize = bytes.length >= 100 ? view.getUint16(16) : 0;
      return {kind:'text',summary:'SQLite 数据库 · 只读取文件头',text:'这是 SQLite 数据库，不能作为普通文本展开。\n\n文件大小：'+file.size+' 字节\n数据库页大小：'+(pageSize===1?65536:pageSize)+' 字节\n\n本页不执行 SQL，也不读取数据库表记录；查看完整内容需使用数据库工具。'};
    }
    const binary = ['zst','zip','7z','gz','exe','dll','sqlite-wal','sqlite-shm','db-wal','db-shm','pdf'].includes(extension);
    let text;
    if (!binary) {
      if (bytes[0]===255 && bytes[1]===254) text=new TextDecoder('utf-16le').decode(bytes);
      else if (bytes[0]===254 && bytes[1]===255) text=new TextDecoder('utf-16be').decode(bytes);
      else {
        try {text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}
        catch {text=new TextDecoder('gb18030').decode(bytes);}
      }
    }
    if (binary || /[\u0000-\u0008\u000e-\u001f]/.test(text)) {
      const hex = Array.from(bytes.slice(0,256),(b,i)=>(i%16===0?'\n'+i.toString(16).padStart(4,'0')+'  ':'')+b.toString(16).padStart(2,'0')).join(' ');
      return {kind:'text',summary:'二进制文件 · 前 256 字节',text:'此格式不按文本解释。\n文件大小：'+file.size+' 字节\n\n十六进制预览：'+hex};
    }
    return {kind:'text',summary:file.size>TEXT_LIMIT?'文本预览 · 仅前 256 KiB':'文本预览',text:redact(text)+(file.size>TEXT_LIMIT?'\n\n……文件较大，预览已截断。':'')};
  }
  return {redact,listDirectory,readPreview};
})();
if (typeof module !== 'undefined') module.exports = DshFilePreview;
</script>
  <script>
  (() => {
    const root = document.getElementById('dsh-directory-explorer');
    let data = { captured: '', items: [], root: [], blobs: {} };
    const definitions = {name:['名称',26],note:['备注',32],advice:['重装建议',12],modified:['修改日期',15],type:['类型',8],size:['大小',7]};
    const defaults = Object.keys(definitions);
    let columns = [...defaults], query = '', filter = 'all', dragged = null;
    let items = data.items, stack = [], busy = false, imageUrl = null, view = 'tree';
    const expanded = new Set(), directoryCache = new Map();
    let rowRefs = [];
    const search = root.querySelector('.ce-search'), select = root.querySelector('select');
    const head = root.querySelector('thead'), body = root.querySelector('tbody');
    const esc = text => String(text).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const size = value => value === null ? '—' : value < 1024 ? value+' B' : value < 1048576 ? (value/1024).toFixed(1)+' KiB' : value < 1073741824 ? (value/1048576).toFixed(1)+' MiB' : (value/1073741824).toFixed(2)+' GiB';
    // 仅保存列顺序等展示偏好，不持久化目录权限或文件正文。
    function remember() {
      const state = {columns,query,filter,view};
      try { localStorage.setItem('dsh-directory-guide-v1',JSON.stringify(state)); } catch {}
    }
    function restore(state) {
      if(!state || typeof state !== 'object') return;
      if(Array.isArray(state.columns) && state.columns.length===defaults.length && new Set(state.columns).size===defaults.length && state.columns.every(x=>defaults.includes(x))) columns=[...state.columns];
      query=typeof state.query==='string'?state.query:'';
      filter=[...select.options].some(o=>o.value===state.filter)?state.filter:'all';
      view=['tree','columns','icons'].includes(state.view)?state.view:'tree';
      search.value=query; select.value=filter;
    }
    function moveColumn(from,to) {
      if(!defaults.includes(from)||!defaults.includes(to)||from===to) return;
      const next=[...columns], index=next.indexOf(to);
      next.splice(next.indexOf(from),1); next.splice(index,0,from); columns=next;
      render(); remember();
    }
    const pathKey = context => JSON.stringify(context.map(entry=>entry.name));
    const childContext = (item,context) => [...context,{name:item.name,handle:item.handle}];
    const icon = item => `<span class="${item.directory?'ce-folder':'ce-file'}" aria-hidden="true"></span>`;
    const badge = item => `<span class="ce-advice" data-kind="${esc(item.advice)}">${esc(item.advice)}</span>`;
    function ref(item,context){rowRefs.push({item,context});return rowRefs.length-1;}
    function render() {
      rowRefs=[];
      const needle=query.trim().toLocaleLowerCase();
      const match=item=>(filter==='all'||(filter==='directory'?item.directory:filter==='file'?!item.directory:item.advice===filter))&&`${item.name} ${item.note} ${item.advice}`.toLocaleLowerCase().includes(needle);
      // 只遍历已经展开并读取的分支；筛选保留匹配后代的父目录，避免丢失层级关系。
      function treeRows(entries,context,depth=0){
        const result=[];
        for(const item of entries){
          const key=pathKey(childContext(item,context));
          const children=item.directory&&expanded.has(key)?treeRows(directoryCache.get(key)||[],childContext(item,context),depth+1):[];
          if(match(item)||children.length)result.push({item,context,depth,key},...children);
        }
        return result;
      }
      const matches=view==='tree'?treeRows(items,stack):items.filter(match).map(item=>({item,context:stack,depth:0}));
      root.querySelector('.ce-grid-wrap').hidden=view!=='tree';root.querySelector('.ce-columns').hidden=view!=='columns';root.querySelector('.ce-icons').hidden=view!=='icons';
      root.querySelector('.ce-collapse').hidden=view!=='tree';root.querySelector('.ce-reset').hidden=view!=='tree';
      root.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));
      root.querySelector('.ce-view-help').textContent=view==='tree'?'点三角原地展开，可同时展开多个分支；点名称进入目录或预览文件。搜索当前目录及已展开的内容。':view==='columns'?'左侧保留父目录，点文件夹在右侧展开下一栏；点文件预览。搜索和筛选作用于最后一栏。':'按图标查看当前目录，点文件夹进入；点文件预览。';
      root.querySelector('colgroup').innerHTML=columns.map(key=>`<col style="width:${definitions[key][1]}%">`).join('');
      head.innerHTML='<tr>'+columns.map((key,i)=>`<th scope="col" data-key="${key}"><div class="ce-head"><span class="ce-head-label">${definitions[key][0]}</span><button type="button" class="ce-colmove cursor-interaction" data-move="-1" aria-label="${definitions[key][0]}列左移" ${i===0?'disabled':''}>‹</button><button type="button" class="ce-colmove cursor-interaction" data-move="1" aria-label="${definitions[key][0]}列右移" ${i===columns.length-1?'disabled':''}>›</button></div></th>`).join('')+'</tr>';
      body.innerHTML=view!=='tree'?'':matches.map(row=>{const {item,context,depth,key:branch}=row,index=ref(item,context);return '<tr>'+columns.map(key=>{
        let content=key==='name'?`<div class="ce-tree-name" style="--depth:${depth}">${item.directory?`<button type="button" class="ce-disclosure" data-toggle="${index}" aria-expanded="${expanded.has(branch)}" aria-label="${expanded.has(branch)?'收起':'展开'} ${esc(item.name)}">${expanded.has(branch)?'▾':'▸'}</button>`:'<span class="ce-indent"></span>'}<button type="button" class="ce-name ce-open" data-open="${index}" aria-label="${item.directory?'进入文件夹':'预览文件'} ${esc(item.name)}">${icon(item)}<span>${esc(item.name)}</span></button></div>`:key==='note'?esc(item.error||item.note):key==='advice'?badge(item):key==='modified'?esc(item.modified):key==='type'?(item.directory?'文件夹':item.name.endsWith('.sqlite')?'数据库':'文件'):esc(size(item.size));
        return `<td data-column="${key}">${content}</td>`;
      }).join('')+'</tr>'}).join('');
      root.querySelector('.ce-icons').innerHTML=view!=='icons'?'':matches.map(({item,context})=>`<button type="button" class="ce-tile" data-open="${ref(item,context)}" aria-label="${item.directory?'进入文件夹':'预览文件'} ${esc(item.name)}">${icon(item)}<span>${esc(item.name)}</span><span class="ce-tile-note">${esc(item.error||item.note)}</span>${badge(item)}</button>`).join('');
      root.querySelector('.ce-columns').innerHTML=view!=='columns'?'':(stack.length?stack:[{name:'.dsh',items}]).map((entry,i)=>{
        const context=stack.slice(0,i+1), last=i===(stack.length||1)-1, entries=(entry.items||directoryCache.get(pathKey(context))||[]).filter(item=>!last||match(item));
        return `<section class="ce-pane" aria-label="${esc(entry.name)} 分栏"><div class="ce-pane-title">${esc(entry.name)}</div>${entries.length?entries.map(item=>`<button type="button" class="ce-column-item" data-open="${ref(item,context)}" aria-current="${stack[i+1]?.name===item.name}" aria-label="${item.directory?'进入文件夹':'预览文件'} ${esc(item.name)}">${icon(item)}<span class="ce-column-copy"><span>${esc(item.name)}</span><span class="ce-column-note">${esc(item.error||item.note)}</span>${badge(item)}</span>${item.directory?'<span aria-hidden="true">›</span>':''}</button>`).join(''):'<div class="ce-empty">此目录为空或没有匹配项</div>'}</section>`;
      }).join('');
      root.querySelector('.ce-empty').hidden=matches.length>0||view==='columns';
      root.querySelector('.ce-count').textContent=`当前目录 ${items.length} 个项目 · ${view==='tree'?'含已展开内容，':''}显示 ${matches.length} 项`;
      root.querySelector('.ce-up').disabled=stack.length<=1;
      if(stack.length)root.querySelector('.ce-crumb').innerHTML=stack.map((entry,i)=>`<button type="button" data-level="${i}">${esc(entry.name)}</button>`).join(' › ');
      root.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));
      select.value=filter;
    }
    // 使用指针事件兼容嵌入式预览；原生 HTML 拖放在部分沙箱中不触发。
    head.addEventListener('pointerdown',event=>{const th=event.target.closest('th');if(!th||event.target.closest('button')||event.button!==0)return;dragged={key:th.dataset.key,x:event.clientX};head.setPointerCapture(event.pointerId);event.preventDefault()});
    head.addEventListener('pointermove',event=>{if(!dragged||Math.abs(event.clientX-dragged.x)<5)return;const th=document.elementFromPoint(event.clientX,event.clientY)?.closest('th');head.querySelectorAll('.ce-drop').forEach(x=>x.classList.remove('ce-drop'));if(th&&head.contains(th))th.classList.add('ce-drop')});
    head.addEventListener('pointerup',event=>{if(!dragged)return;const from=dragged;dragged=null;const th=document.elementFromPoint(event.clientX,event.clientY)?.closest('th');if(head.hasPointerCapture(event.pointerId))head.releasePointerCapture(event.pointerId);head.querySelectorAll('.ce-drop').forEach(x=>x.classList.remove('ce-drop'));if(th&&head.contains(th)&&Math.abs(event.clientX-from.x)>=5)moveColumn(from.key,th.dataset.key)});
    head.addEventListener('pointercancel',()=>{dragged=null;head.querySelectorAll('.ce-drop').forEach(x=>x.classList.remove('ce-drop'))});
    head.addEventListener('click',event=>{const button=event.target.closest('[data-move]');if(!button)return;const key=button.closest('th').dataset.key;moveColumn(key,columns[columns.indexOf(key)+Number(button.dataset.move)])});
    search.addEventListener('input',()=>{query=search.value;render();remember()});
    select.addEventListener('change',()=>{filter=select.value;render();remember()});
    root.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.filter==='all'&&stack.length>1){act(()=>loadDirectory(stack.slice(0,1)));return;}filter=b.dataset.filter;render();remember()}));
    root.querySelector('.ce-reset').addEventListener('click',()=>{columns=[...defaults];render();remember()});
    root.querySelector('.ce-views').addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(!button)return;view=button.dataset.view;render();remember();if(view==='columns'){const pane=root.querySelector('.ce-columns');pane.scrollLeft=pane.scrollWidth}});
    root.querySelector('.ce-collapse').addEventListener('click',()=>{expanded.clear();render()});
    try{restore(JSON.parse(localStorage.getItem('dsh-directory-guide-v1')))}catch{}

    // ——— 数据层：Host 半把 ~/.dsh 走成一份 JSON，这里把它伪装成目录句柄 ———
    const encoder = new TextEncoder();
    function snapshotHandle(node, rel) {
      return {
        kind: node.directory ? 'directory' : 'file',
        name: node.name,
        snapshot: node,
        async *values() { for (const child of node.children || []) yield snapshotHandle(child, rel ? rel + '/' + child.name : child.name); },
        async getFile() {
          const text = data.blobs[rel];
          const bytes = text === undefined ? new Uint8Array() : encoder.encode(text);
          return { name: node.name, size: node.size ?? 0, lastModified: node.mtime || 0, snapshotSkip: node.skip,
                   slice: () => ({ arrayBuffer: async () => bytes.buffer.slice(0) }) };
        }
      };
    }
    let mode = 'snapshot';
    function bootSnapshot() {
      const stamp = root.querySelector('.ce-captured');
      if (stamp) stamp.textContent = '采集时间：' + data.captured;
      return loadDirectory([{ name: '.dsh', handle: snapshotHandle({ name: '.dsh', directory: true, children: data.root }, '') }], true);
    }
    // 插件版由 Host 路由给数据；离线版把同一份 JSON 贴在空的 ce-data 块里。
    async function loadSnapshot() {
      const inline = root.querySelector('script.ce-data');
      let payload;
      if (inline && inline.textContent.trim().length > 0) payload = JSON.parse(inline.textContent);
      else {
        const response = await fetch('/dsh-directory-guide/snapshot', { headers: { accept: 'application/json' } });
        payload = await response.json();
        if (!response.ok) throw new Error(payload?.error || ('HTTP ' + response.status));
      }
      data = payload;
      await bootSnapshot();
    }

    function status(message,error=false){const el=root.querySelector('.ce-live');el.replaceChildren(document.createTextNode(message+' '));const button=document.createElement('button');button.type='button';button.className='ce-connect';button.textContent='读取实时目录';el.append(button);el.dataset.error=String(error)}
    async function loadDirectory(next,reset=false) {
      status('正在读取当前目录…');
      const loaded=await DshFilePreview.listDirectory(next.at(-1).handle,next.slice(1).map(x=>x.name),data.items);
      // 读取完成才替换当前视图；权限失效或目录已删除时保留旧列表。
      if(reset){expanded.clear();directoryCache.clear();}
      next.at(-1).items=loaded;directoryCache.set(pathKey(next),loaded);
      next.forEach((entry,i)=>{entry.items=directoryCache.get(pathKey(next.slice(0,i+1)))||entry.items;});
      stack=next;items=loaded;query='';filter='all';search.value='';render();
      root.querySelector('.ce-grid-wrap').scrollTop=0;
      if(view==='columns'){const pane=root.querySelector('.ce-columns');pane.scrollLeft=pane.scrollWidth;}
      status(mode==='live' ? '实时模式 · '+stack.map(x=>x.name).join(' / ')+' · 三角展开分支，名称打开目录或文件'
        : '快照 · '+data.captured+' 采集 · 三角展开分支，名称预览已内联的正文');
    }
    async function connect() {
      if(!window.showDirectoryPicker || window.top!==window.self)throw new Error('当前宿主拿不到本地目录权限。宿主不可用时，用 Chrome 或 Edge 直接打开仓库根目录的 dsh-directory-guide.html 离线版。');
      const handle=await window.showDirectoryPicker({id:'dsh-directory-guide',mode:'read'});
      mode='live';
      if(handle.name!=='.dsh')throw new Error('选中的是 '+handle.name+'，不是 .dsh。.dsh 是隐藏目录：在选择器地址栏粘贴完整路径（例如 C:\\Users\\<用户名>\\.dsh）回车，再点『选择文件夹』。');
      await loadDirectory([{name:handle.name,handle}],true);
    }
    async function preview(item,context) {
      const dialog=root.querySelector('dialog');
      root.querySelector('#ce-preview-title').textContent=[...context.map(x=>x.name),item.name].join(' / ');
      const text=root.querySelector('.ce-preview-text'), image=root.querySelector('.ce-preview-image');
      text.hidden=false;image.hidden=true;image.removeAttribute('src');text.textContent='正在读取…';
      root.querySelector('.ce-preview-meta').textContent='';dialog.showModal();
      try {
        const file=await item.handle.getFile();
        const result=await DshFilePreview.readPreview(file,[...context.map(x=>x.name),item.name]);
        if(!dialog.open)return;
        root.querySelector('.ce-preview-meta').textContent=result.summary+' · '+size(file.size);
        if(result.kind==='image'){imageUrl=URL.createObjectURL(result.file);image.src=imageUrl;image.hidden=false;text.hidden=true;}
        else text.textContent=result.text;
      } catch(error){text.textContent='无法读取文件：'+error.message;}
    }
    async function act(action) {
      if(busy)return;busy=true;
      try {await action();}catch(error){if(error.name==='AbortError')status('已取消选择；当前列表保持不变');else status(error.message||'读取失败，请重新选择目录',true);}
      finally{busy=false;}
    }
    root.querySelector('.ce-live').addEventListener('click',event=>{if(event.target.closest('.ce-connect'))act(connect)});
    root.querySelector('.ce-main').addEventListener('click',event=>{const button=event.target.closest('[data-open],[data-toggle]');if(!button)return;const toggle=button.dataset.toggle!==undefined;const row=rowRefs[Number(toggle?button.dataset.toggle:button.dataset.open)];if(!row)return;act(async()=>{
      let {item,context}=row;
      if(!stack.length){await connect();item=items.find(x=>x.name===item.name);context=stack;}
      if(!item)throw new Error('此项目已不存在，请查看刷新后的列表。');
      if(toggle&&item.directory){
        const next=childContext(item,context),key=pathKey(next);
        if(expanded.has(key))expanded.delete(key);
        else {
          if(!directoryCache.has(key)){status('正在展开 '+item.name+'…');directoryCache.set(key,await DshFilePreview.listDirectory(item.handle,next.slice(1).map(x=>x.name),data.items));}
          expanded.add(key);
        }
        render();status(expanded.has(key)?'已展开 '+item.name+'，可继续展开其他文件夹':'已收起 '+item.name);
      }else if(item.directory)await loadDirectory(childContext(item,context));else await preview(item,context);
    })});
    root.querySelector('.ce-up').addEventListener('click',()=>act(()=>loadDirectory(stack.slice(0,-1))));
    root.querySelector('.ce-crumb').addEventListener('click',event=>{const button=event.target.closest('[data-level]');if(button)act(()=>loadDirectory(stack.slice(0,Number(button.dataset.level)+1)))});
    root.querySelector('.ce-preview-close').addEventListener('click',()=>root.querySelector('dialog').close());
    root.querySelector('dialog').addEventListener('close',()=>{if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=null;root.querySelector('.ce-preview-text').textContent='';root.querySelector('.ce-preview-image').removeAttribute('src')});
    loadSnapshot().catch(error=>status('读取 ~/.dsh 失败：'+(error.message||error),true));
  })();
  </script>
