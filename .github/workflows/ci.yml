name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows, not Linux: the adapter specs assert Windows drive-letter path
    # handling (`C:`, `D:` fixtures for Codex and Claude Code homes), which Linux
    # reads as relative paths. The plugin was also verified on this platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
