# The one Loader row the agent-import feature needs: the Host plugin that reads
# the foreign declarations, plus — through this package's own `dsh.client`
# declaration — the browser half that adds its page to the Settings sections. The
# id must stay `agent-import`: the settings namespace the plugin serves, and
# therefore the page that follows it, is keyed by the row's own entry id.
#
# Every option below is optional, and these are the defaults. `sources` selects
# the tools whose MCP servers are mounted; `skillSources` selects the directories
# whose skills are imported as links into `~/.dsh/skills` (dsh's own roots are
# always read); `skillAutoImport` imports from those sources on activation, and
# the Skills page can still import or remove one skill at a time.
#
# This overlay is for the package NOT being listed in the profile's
# `dsh.profile.bundles` (nor installed with `dsh plugin add`, which applies the
# package's own bundle patch): in either of those cases the bundle layer already
# inserts this same id, and adding it here again leaves two rows with one id —
# the plugin market's preflight then reports `duplicate loader entry id` and
# rolls the install back. To configure an already-bundled row, patch it by id
# with a `- id: agent-import` + `config:` entry and no `insert`.
- insert:
    - id: agent-import
      name: '@free-lzj/dsh-agent-import'
      # config:
      #   sources: [codex, claude-code]
      #   skillSources: [codex, claude-code]
      #   skillAutoImport: true
