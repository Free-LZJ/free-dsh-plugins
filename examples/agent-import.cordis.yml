# The one Loader row the agent-import feature needs: the Host plugin that reads
# the foreign declarations, plus — through this package's own `dsh.client`
# declaration — the browser card that configures it in the Plugins page. The id
# must stay `agent-import`: the settings namespace the plugin serves, and
# therefore the card that follows it, is keyed by the row's own entry id.
- insert:
    - id: agent-import
      name: '@free-lzj/dsh-agent-import'
